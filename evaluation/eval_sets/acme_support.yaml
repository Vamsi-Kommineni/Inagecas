# Curated eval set for the bundled Acme Cloud sample docs.
# Seed the corpus first (`make seed`), then run `make eval`.
#
# expect: one of answered | refused | clarification, or a list of acceptable ones.
# expect_sources: substrings that good retrieval should cite (title or source_uri).
#   An inner list means any one of them is fine.
# history: earlier turns for a follow-up ticket, oldest first.
# image: a screenshot next to this file, sent with the question.

# --- Answerable: the answer is in the docs ---------------------------------
- id: free-plan-members
  category: how_to
  question: "How many members can the Free plan have?"
  expect: answered
  # Both docs state the limit; citing either is correct.
  expect_sources: [["billing", "getting-started"]]

- id: change-plan
  category: how_to
  question: "How do I upgrade or change my plan?"
  expect: answered
  expect_sources: ["billing"]

