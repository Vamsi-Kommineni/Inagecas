# --- Follow-ups: the question only makes sense with the earlier turns -------
- id: followup-annual-refund
  category: follow_up
  history:
    - role: customer
      content: "Can I get a refund on a monthly plan?"
    - role: assistant
      content: "Monthly plans are non-refundable [1]."
  question: "And on the annual plan?"
  expect: answered
  expect_sources: ["billing"]

- id: followup-invite-limit
  category: follow_up
  history:
    - role: customer
      content: "How do I invite teammates?"
    - role: assistant
      content: "Workspace owners can invite teammates from Settings → Members → Invite [1]."
  question: "How many can I invite on the free plan?"
  expect: answered
  expect_sources: [["getting-started", "billing"]]

- id: followup-region
  category: follow_up
  history:
    - role: customer
      content: "How do I create my first project?"
    - role: assistant
      content: "From the dashboard, click New project, give it a name, and choose a region [1]."
  question: "Can I change it later?"
  expect: answered
  expect_sources: ["getting-started"]

