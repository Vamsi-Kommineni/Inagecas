[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Parses, chunks, embeds, and indexes approved documentation."
requires-python = ">=3.12"
dependencies = [
    "inagecas-shared",
    "arq>=0.26",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "fastembed>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_worker"]
