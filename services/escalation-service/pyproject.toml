[project]
name = "escalation-service"
version = "0.1.0"
description = "Human escalation queue: work items, assignment, and agent feedback."
requires-python = ">=3.12"
dependencies = [
    "inagecas-shared",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escalation_service"]
