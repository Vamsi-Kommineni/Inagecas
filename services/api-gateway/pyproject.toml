[project]
name = "api-gateway"
version = "0.1.0"
description = "Public API: intake, ask, ingest, and admin endpoints."
requires-python = ">=3.12"
dependencies = [
    "inagecas-shared",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "arq>=0.26",
    "slowapi>=0.1.9",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
