[project]
name = "answer-service"
version = "0.1.0"
description = "Generates grounded answers from evidence, or refuses when support is weak."
requires-python = ">=3.12"
dependencies = [
    "inagecas-shared",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answer_service"]
