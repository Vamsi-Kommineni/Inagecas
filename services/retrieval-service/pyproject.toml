[project]
name = "retrieval-service"
version = "0.1.0"
description = "Embeds queries, searches Qdrant, and assembles evidence for answering."
requires-python = ">=3.12"
dependencies = [
    "inagecas-shared",
    "uvicorn[standard]>=0.30",
    "fastembed>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_service"]
