[project]
name = "vision-service"
version = "0.1.0"
description = "OCR screenshots into structured image facts for retrieval."
requires-python = ">=3.12"
dependencies = [
    "inagecas-shared",
    "uvicorn[standard]>=0.30",
    "rapidocr-onnxruntime>=1.3",
    "pillow>=10.3",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_service"]
